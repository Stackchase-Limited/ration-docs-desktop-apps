<!-- The Ration Docs wordmark for the title-bar button.
     Two groups, as the original had: CSVGPushButton::setIcon(":/logo.svg", node)
     renders one element by id, and cmainpanelimpl picks "logo-light" on a dark
     theme and "logo-dark" on a light one - the names describe the theme, not the
     ink, which is why the dark-ink mark is the one called logo-dark. Raster rather
     than paths because the wordmark we have is a PNG; embedded at 2x and drawn at
     119x20 so it stays sharp on a hidpi screen. -->
<svg width="119" height="20" viewBox="0 0 119 20" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <g id="logo-dark"><image x="0" y="0" width="119" height="20" xlink:href="data:image/png;base64,"/></g>
  <g id="logo-light"><image x="0" y="0" width="119" height="20" xlink:href="data:image/png;base64,"/></g>
</svg>
